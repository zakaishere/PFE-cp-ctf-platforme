services:

  postgres:
    image: postgres:16-alpine
    container_name: psp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psp_db
      POSTGRES_USER: psp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psp_user -d psp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Memory tuned for a 4GB-RAM target host. mem_limit + cpus are the
    # non-swarm resource caps honored by `docker compose up`.
    mem_limit: 300m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: psp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 150m = 128mb maxmemory data + process overhead. Do not drop below ~140m
    # or redis will be OOM-killed once the cache fills.
    mem_limit: 150m
    cpus: 0.5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: psp-rabbitmq
    hostname: psp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-psp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-psp_password}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 350m
    cpus: 1.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psp-backend
    restart: unless-stopped
    # /dev/shm is the default execution.workdir — raise from Docker's 64MB
    # default to give concurrent submissions room. Tune for peak concurrency
    # (rule of thumb: peak_concurrent_submissions * EXECUTION_TMPFS_MB).
    shm_size: '512mb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/psp_db
      DB_USERNAME: psp_user
      DB_PASSWORD: ${DB_PASSWORD:-psp_password}
      DB_POOL_SIZE: 50
      # Same connection, as libpq's native env vars — read directly by psql /
      # pg_isready in docker-entrypoint.sh (the automatic schema bootstrap),
      # no flags or JDBC-URL parsing needed.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: psp_db
      PGUSER: psp_user
      PGPASSWORD: ${DB_PASSWORD:-psp_password}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      CTF_FLAG_SECRET: ${CTF_FLAG_SECRET:-CHANGE_ME_IN_PRODUCTION}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-psp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-psp_password}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Browser-facing CORS. Defaults to "*" (any origin) so the site works
      # immediately from whatever IP/domain you access it at, without needing
      # to hardcode one — tighten to your real domain(s), comma-separated,
      # for anything more than a demo (e.g. https://yourdomain.com).
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      # Schema is now applied automatically on every boot by
      # docker-entrypoint.sh (schema.sql + db/migration_v*.sql) — this is a
      # safety-net override only, not required for normal operation anymore.
      DDL_AUTO: ${DDL_AUTO:-validate}
      # ── CTF worker agent (external service, runs from ../ctf-worker-agent's
      #    own docker-compose). Empty WORKER_AGENT_URL = agent disabled, the
      #    backend falls back to local Docker for CTF instances.
      #    From inside this container the host-run agent is reachable at
      #    http://host.docker.internal:8000
      WORKER_AGENT_URL: ${WORKER_AGENT_URL:-}
      WORKER_AGENT_KEY_ID: ${WORKER_AGENT_KEY_ID:-}
      WORKER_AGENT_SECRET: ${WORKER_AGENT_SECRET:-}
      # URL the agent uses to call back into this platform (ZIP downloads)
      PLATFORM_INTERNAL_URL: ${PLATFORM_INTERNAL_URL:-http://host.docker.internal:8080}
      # ── Email (OTP verification, password reset) ────────────────────────
      # Required whenever app.security.disable-verification=false (the prod
      # default — see application-prod.yml). Empty credentials mean every
      # OTP email silently fails to send (EmailStartupCheck warns loudly in
      # the logs if this happens). Gmail requires an App Password, not the
      # account password: https://myaccount.google.com/apppasswords
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Set true to skip real email entirely: accounts auto-verify, no OTP is
      # ever sent, MAIL_USERNAME/MAIL_PASSWORD become irrelevant. Overrides
      # application-prod.yml's disable-verification:false (Spring env vars
      # win over any application-*.yml value). Off by default — real
      # deployments should use real email.
      APP_SECURITY_DISABLE_VERIFICATION: ${DISABLE_EMAIL_VERIFICATION:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ctf_uploads:/tmp/ctf-uploads
      - backend_logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 900m cap → JVM heap auto-sizes to ~675m (Dockerfile: MaxRAMPercentage=75).
    # The Dockerfile ENTRYPOINT does NOT read JAVA_OPTS; heap is driven by this
    # mem_limit, not -Xmx. shm_size above is separate host RAM for /dev/shm.
    mem_limit: 900m
    cpus: 2.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: psp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 250m
    cpus: 1.0

  # ── Prometheus (admin observability) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: psp-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    # No healthcheck: the prom/prometheus image is distroless (no shell/curl/wget),
    # so a CMD healthcheck can't run. Non-critical observability; ordering only.
    mem_limit: 300m
    cpus: 0.5

  # ── Grafana (admin-only dashboards) ───────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: psp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3001 on host — 3000 is the frontend
    depends_on:
      - prometheus
    mem_limit: 250m
    cpus: 0.5

volumes:
  postgres_data:
  ctf_uploads:
  backend_logs:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
