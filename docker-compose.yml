version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: psp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psp_db
      POSTGRES_USER: psp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psp_user -d psp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: psp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 64M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: psp-rabbitmq
    hostname: psp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-psp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-psp_password}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psp-backend
    restart: unless-stopped
    # /dev/shm is the default execution.workdir — raise from Docker's 64MB
    # default to give concurrent submissions room. Tune for peak concurrency
    # (rule of thumb: peak_concurrent_submissions * EXECUTION_TMPFS_MB).
    shm_size: '512mb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/psp_db
      DB_USERNAME: psp_user
      DB_PASSWORD: ${DB_PASSWORD:-psp_password}
      DB_POOL_SIZE: 50
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      CTF_FLAG_SECRET: ${CTF_FLAG_SECRET:-CHANGE_ME_IN_PRODUCTION}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-psp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-psp_password}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ctf_uploads:/tmp/ctf-uploads
      - backend_logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
  ctf_uploads:
  backend_logs:
  rabbitmq_data:
