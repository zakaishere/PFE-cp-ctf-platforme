worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # ── Plain HTTP — no domain/TLS configured (IP-only access) ──────────────────
    # Add a server_name + a second `listen 443 ssl` block with real certs once
    # a domain is available; see CTF-icode/nginx/nginx.conf for that pattern.
    server {
        listen 80 default_server;
        server_name _;

        # Challenge ZIP uploads can be sizeable; add headroom.
        client_max_body_size 150m;

        # Long timeout for Docker image builds (backend allows up to 600s).
        proxy_read_timeout    620s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    620s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Health check (nginx itself) ──────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── WebSocket — STOMP over SockJS (/ws-endpoint and /ws) ────────────
        # Must be matched before /api to avoid the /ws path being caught by /api/
        location ~ ^/(ws-endpoint|ws)(/|$) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        # ── Backend API (/api/ prefix preserved) ─────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_buffering on;
        }

        # ── Frontend — everything else ────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            # Next.js dev-mode SSE / hot-reload needs unbuffered responses.
            proxy_buffering off;
        }
    }
}
