spring:
  application:
    name: backend-psp

  # ── Devtools ─────────────────────────────────────
  devtools:
    restart:
      exclude: "*.json"

  # ── Database ─────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psp_db}
    username: ${DB_USERNAME:psp_user}
    password: ${DB_PASSWORD:psp_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: PSPHikariPool

  # ── JPA ──────────────────────────────────────────
  jpa:
    hibernate:
      # validate: checks schema matches entities, fails fast if mismatch.
      # NEVER set 'update' in production — use migration files instead.
      # (Local dev overrides this in application-dev.yml. DDL_AUTO=update is
      # the documented escape hatch for FIRST boot on a fresh Docker volume,
      # where no schema exists yet — switch back to validate afterwards.)
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false

  # ── RabbitMQ ─────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_PASS:guest}}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 4
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

  # ── Mail ─────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true

  # ── Cache (Caffeine in-memory) ────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
    cache-names:
      - scoreboard
      - challenges
      - competition-status
      - user-profile
      - leaderboard
      - hint-unlocks

# ── Server ───────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 20000

# ── Dev overrides ───────────────────────────────────
app:
  security:
    disable-verification: true   # new accounts auto-verified; skip email check on login

# ── JWT ──────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_TO_A_256_BIT_BASE64_ENCODED_SECRET_KEY}
  expiration-ms: ${JWT_EXPIRY_MS:86400000}

# ── CTF ──────────────────────────────────────────────
ctf:
  flag-secret: ${CTF_FLAG_SECRET:CHANGE_ME}
  instance:
    host: ${CTF_INSTANCE_HOST:localhost}
    port:
      min: ${CTF_PORT_MIN:32000}
      max: ${CTF_PORT_MAX:33000}
    network:
      prefix: ctf-net-
    cleanup-interval-ms: 60000
  upload:
    path: ${CTF_UPLOAD_PATH:/tmp/ctf-uploads}
  images:
    prefix: psp-ctf
  build:
    timeout-seconds: 300
    max-zip-size-mb: 100
  # URL the worker agent uses to reach this platform (ZIP downloads for builds)
  platform-internal-url: ${PLATFORM_INTERNAL_URL:http://localhost:8080}
  # External worker agent (FastAPI) — leave url empty to disable and use local Docker
  worker:
    agent:
      url: ${WORKER_AGENT_URL:}
      key-id: ${WORKER_AGENT_KEY_ID:}
      secret: ${WORKER_AGENT_SECRET:}
      timeout-seconds: 30
      poll-interval-ms: 2000
      poll-max-attempts: 60

# ── Docker ───────────────────────────────────────────
docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  tls:
    verify: ${DOCKER_TLS_VERIFY:false}
    cert-path: ${DOCKER_CERT_PATH:}

# ── Ephemeral execution (Exam/CP code runner) ───────
# workdir: host directory where per-submission source/input files are staged
#   and bind-mounted read-only into the container at /src. Defaults to /dev/shm
#   (RAM-disk, fast). Override to a disk path if /dev/shm is undersized.
# tmpfs-size-mb: in-container /app tmpfs size for compiled artefacts + runtime
#   scratch. The host backend container must also have shm_size >= ~ N * this
#   value where N is your peak concurrent submissions (see docker-compose.yml).
execution:
  workdir: ${EXECUTION_WORKDIR:/dev/shm}
  tmpfs-size-mb: ${EXECUTION_TMPFS_MB:100}

# ── Actuator & Metrics ──────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /api/actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    # Personal Gmail SMTP has no password configured in dev — email is a
    # false-positive dependency here since verification is bypassed in dev
    # ("Testing Mode") and demo/prod-without-email should not read as DOWN
    # for an unrelated, unused dependency.
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ── Logging ──────────────────────────────────────────
logging:
  level:
    root: WARN
    com.university.platform: INFO
    com.university.platform.ctf: INFO
    com.university.platform.execution: INFO

    # These were spamming logs — silence them
    com.university.platform.config.DataSeeder: WARN
    com.university.platform.config.TestDataSeeder: WARN
    com.university.platform.config.AcademicSeeder: WARN

    # Third-party noise — silence
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    org.springframework.security: WARN
    com.github.dockerjava: WARN
    org.apache.http: WARN

  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %cyan([%thread]) %yellow(%logger{20}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"

  file:
    name: logs/psp-platform.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
