spring:
  application:
    name: backend-psp

  # ── Devtools ─────────────────────────────────────
  devtools:
    restart:
      exclude: "*.json"

  # ── Database ─────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psp_db}
    username: ${DB_USERNAME:psp_user}
    password: ${DB_PASSWORD:psp_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: PSPHikariPool

  # ── JPA ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
      # NEVER use 'update' — use migration files instead.
      # validate: checks schema matches entities, fails fast if mismatch.
      # (Local dev overrides this to 'update' in application-dev.yml.)
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false

  # ── RabbitMQ ─────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1

  # ── Mail ─────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true

  # ── Cache (Caffeine in-memory) ────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
    cache-names:
      - scoreboard
      - challenges
      - competition-status
      - user-profile
      - leaderboard

# ── Server ───────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 20000

# ── Dev overrides ───────────────────────────────────
app:
  security:
    disable-verification: true   # new accounts auto-verified; skip email check on login

# ── JWT ──────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_TO_A_256_BIT_BASE64_ENCODED_SECRET_KEY}
  expiration-ms: ${JWT_EXPIRY_MS:86400000}

# ── CTF ──────────────────────────────────────────────
ctf:
  flag-secret: ${CTF_FLAG_SECRET:CHANGE_ME}
  instance:
    host: ${CTF_INSTANCE_HOST:localhost}
    port:
      min: ${CTF_PORT_MIN:32000}
      max: ${CTF_PORT_MAX:33000}
    network:
      prefix: ctf-net-
    cleanup-interval-ms: 60000
  upload:
    path: ${CTF_UPLOAD_PATH:/tmp/ctf-uploads}
  images:
    prefix: psp-ctf
  build:
    timeout-seconds: 300
    max-zip-size-mb: 100

# ── Docker ───────────────────────────────────────────
docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  tls:
    verify: ${DOCKER_TLS_VERIFY:false}
    cert-path: ${DOCKER_CERT_PATH:}

# ── Logging ──────────────────────────────────────────
logging:
  level:
    root: WARN
    com.university.platform: INFO
    com.university.platform.ctf: INFO
    com.university.platform.execution: INFO

    # These were spamming logs — silence them
    com.university.platform.config.DataSeeder: WARN
    com.university.platform.config.TestDataSeeder: WARN
    com.university.platform.config.AcademicSeeder: WARN

    # Third-party noise — silence
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    org.springframework.security: WARN
    com.github.dockerjava: WARN
    org.apache.http: WARN

  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %cyan([%thread]) %yellow(%logger{20}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"

  file:
    name: logs/psp-platform.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
